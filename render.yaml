# ══════════════════════════════════════════
# RALOZ COL SAS — Render Blueprint
# ══════════════════════════════════════════
services:
  - type: web
    name: raloz-web
    runtime: python
    region: oregon
    plan: free
    buildCommand: bash build.sh
    startCommand: cd backend && gunicorn run:app --bind 0.0.0.0:$PORT --workers 2 --timeout 120
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.0"
      - key: NODE_VERSION
        value: "20.11.0"
      - key: DATABASE_URL
        fromDatabase:
          name: raloz-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: NETLIFY_URL
        sync: false          # URL de tu página en Netlify (ej: https://raloz.netlify.app)
      - key: MP_ACCESS_TOKEN
        sync: false          # Token de MercadoPago (APP_USR-xxxx...)
      - key: MP_REDIRECT_URL
        sync: false          # URL donde llega el cliente después de pagar (tu página Netlify)
      - key: BACKEND_URL
        sync: false          # URL de este backend (ej: https://raloz-web.onrender.com)
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: VITE_GOOGLE_CLIENT_ID
        sync: false

databases:
  - name: raloz-db
    databaseName: raloz
    user: raloz_user
    region: oregon
    plan: free
