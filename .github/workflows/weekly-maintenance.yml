# ===================================================================
# RALOZ COL S.A.S — Mantenimiento semanal automático
# ===================================================================
# Programa: lunes 3:00 am hora Colombia (08:00 UTC).
# Hace:
#   1. Backup lógico completo de la BD  (tools/backup_db.py)
#   2. Diagnóstico de integridad        (tools/diagnostico_datos.py)
#   3. Verificación del backup
#   4. Retención
#   5. Notificación por email (Brevo) si hay hallazgos nuevos o
#      si el backup falló.
#
# Manual trigger (workflow_dispatch) disponible para correr bajo demanda.
#
# Requisitos — secrets del repo (Settings → Secrets and variables → Actions):
#   DATABASE_URL      postgresql+psycopg://user:pass@host:5432/db
#   BREVO_API_KEY     (opcional, solo si quieres avisos por email)
#   EMAIL_REMITENTE   (opcional) remitente verificado en Brevo
#   EMAIL_AVISO_TO    (opcional) destino del aviso
#
# Outputs:
#   artifacts/maintenance-<fecha>.zip
#     ├─ backups/raloz_backup_*.sql      ← descargar y guardar aparte
#     └─ backups/.last_state.json
# ===================================================================
name: Weekly Maintenance

on:
  schedule:
    # Lunes 08:00 UTC = 03:00 hora Colombia (UTC-5, sin horario de verano).
    - cron: "0 8 * * 1"
  workflow_dispatch:
    inputs:
      no_backup:
        description: "Saltar backup (solo diagnóstico)"
        type: boolean
        required: false
        default: false
      no_notify:
        description: "No enviar email (imprime el cuerpo)"
        type: boolean
        required: false
        default: false

permissions:
  contents: read

jobs:
  maintenance:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Instalar dependencias mínimas (sin reporte de PDF)
        run: |
          python -m pip install --upgrade pip
          pip install "psycopg[binary]" "requests" python-dotenv
          # Reportlab NO hace falta para el mantenimiento semanal (lo usa solo
          # email_service al mandar facturas con PDF adjunto a clientes).

      - name: Construir .env desde secrets
        env:
          DATABASE_URL:    ${{ secrets.DATABASE_URL }}
          BREVO_API_KEY:   ${{ secrets.BREVO_API_KEY }}
          EMAIL_REMITENTE: ${{ secrets.EMAIL_REMITENTE }}
          EMAIL_AVISO_TO:  ${{ secrets.EMAIL_AVISO_TO }}
          EMAIL_NOMBRE:    ${{ secrets.EMAIL_NOMBRE }}
        run: |
          {
            echo "DATABASE_URL=$DATABASE_URL"
            echo "BREVO_API_KEY=$BREVO_API_KEY"
            echo "EMAIL_REMITENTE=$EMAIL_REMITENTE"
            echo "EMAIL_AVISO_TO=$EMAIL_AVISO_TO"
            echo "EMAIL_NOMBRE=$EMAIL_NOMBRE"
          } > .env
          chmod 600 .env

      - name: Correr mantenimiento
        env:
          DATABASE_URL:    ${{ secrets.DATABASE_URL }}
          BREVO_API_KEY:   ${{ secrets.BREVO_API_KEY }}
          EMAIL_REMITENTE: ${{ secrets.EMAIL_REMITENTE }}
          EMAIL_AVISO_TO:  ${{ secrets.EMAIL_AVISO_TO }}
        run: |
          ARGS=""
          if [ "${{ github.event.inputs.no_backup }}" = "true" ]; then ARGS="$ARGS --no-backup"; fi
          if [ "${{ github.event.inputs.no_notify }}" = "true" ]; then ARGS="$ARGS --no-notify"; fi
          # Permitimos un fallo no-bloqueante: la lógica interna escribe su
          # propio log y notification; aquí solo solo observamos el exit.
          python tools/maintenance.py $ARGS || echo "::warning::maintenance retornó código $?"

      - name: Análisis de temporada (recomendación de fabricación)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          # Genera el markdown en stdout y los CSVs en backups/.
          # No envía nada por email — eso lo activa el dueño manualmente
          # o lo enchufa a otro workflow cuando lo tenga listo.
          python tools/analisis_temporada.py --csv-dir backups/ --top 30 \
            || echo "::warning::analisis_temporada retornó código $?"

      - name: Empaquetar backups como artifact
        if: always()
        run: |
          FECHA=$(date -u +%Y-%m-%d)
          if [ -d backups ] && ls backups/*.sql 1>/dev/null 2>&1; then
            zip -r "maintenance-${FECHA}.zip" backups/ -x "backups/*.zip"
          else
            mkdir -p backups
            echo "# Sin archivos de backup generados" > backups/README.md
            zip -r "maintenance-${FECHA}.zip" backups/
          fi

      - name: Subir artifact (90 días)
        uses: actions/upload-artifact@v4
        with:
          name: maintenance-${{ github.run_id }}
          path: backend/maintenance-*.zip
          retention-days: 90
          if-no-files-found: warn
