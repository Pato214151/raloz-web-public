# CI de raloz-web: corre los tests del backend y verifica que el frontend
# compile, en cada push a main y en cada pull request.
# Render despliega automáticamente al hacer push a main; este workflow no
# despliega nada, solo avisa (✗ rojo en GitHub) si algo se rompió.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend-tests:
    name: Tests backend (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Instalar dependencias
        run: pip install -r requirements.txt pytest
      - name: Correr tests
        run: python -m pytest tests/ -v

  frontend-build:
    name: Build frontend (vite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Instalar dependencias
        run: npm ci
      - name: Type-check (solo archivos .ts/.tsx)
        run: npm run typecheck
      - name: Compilar
        run: npm run build
