version: '3.8'

services:
  # Base de datos PostgreSQL (para desarrollo local)
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: raloz
      POSTGRES_USER: raloz_user
      POSTGRES_PASSWORD: raloz_secret_2024
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U raloz_user -d raloz"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Backend Flask
  backend:
    build: ./backend
    ports:
      - "5000:5000"
    environment:
      - FLASK_ENV=development
      - DATABASE_URL=postgresql://raloz_user:raloz_secret_2024@db:5432/raloz
      - SECRET_KEY=dev-secret-key-cambiar-en-produccion-123456
      - JWT_SECRET_KEY=jwt-dev-secret-key-cambiar-456789
      - CORS_ORIGINS=http://localhost:5173,http://localhost:3000
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app

  # Frontend React (desarrollo)
  frontend:
    image: node:20-alpine
    working_dir: /app
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    depends_on:
      - backend

volumes:
  postgres_data:
